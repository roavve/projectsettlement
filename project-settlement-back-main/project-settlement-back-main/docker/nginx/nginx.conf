load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    log_format apilog '$remote_addr - $request '
                          'status=$status upstream=$upstream_status '
                          'uri=$request_uri upstream_addr=$upstream_addr '
                          'rt=$request_time urt=$upstream_response_time';

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_connect_timeout 10m;
    proxy_read_timeout    10m;
    proxy_send_timeout    10m;
    send_timeout          10m;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    server_tokens off;

    access_log /var/log/nginx/access.log apilog;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    limit_req_log_level  notice;
    limit_conn_log_level notice;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api:20m  rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    map "$http_range$http_request_range" $block_any_range {
      default 1;
      ""      0;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name settlement.energo-pro.ge;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name settlement.energo-pro.ge;

        more_clear_headers "Server";
        more_set_headers   "Server: Netscaler-Gateway";

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate           /etc/nginx/certs/settlement.energo-pro.ge/fullchain-pruned.crt;
        ssl_certificate_key       /etc/nginx/certs/settlement.energo-pro.ge/STAR.energo-pro.ge_key.txt;
        ssl_trusted_certificate   /etc/nginx/certs/settlement.energo-pro.ge/STAR.energo-pro.ge.ca-bundle;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;

        if ($block_any_range) { return 416; }
        proxy_hide_header Accept-Ranges;
        add_header Accept-Ranges "none" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; worker-src 'self' blob:;" always;

        location ~ /\.(?!well-known).* { deny all; return 404; }

        if ($request_uri ~* "^/10\.0\.12\.[0-9]{1,3}") { return 403; }
        location ~ ^/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ { return 403; }

        location ~* \.(log|bak|swp|ini|old|conf)$ { deny all; return 404; }

        location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpe?g)$ {
          expires off;

          add_header Cache-Control "public, max-age=31536000, immutable" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
          add_header X-Frame-Options "DENY" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
          add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; worker-src 'self' blob:;" always;
        }

        location = /index.html {
          expires off;

          add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
          add_header X-Frame-Options "DENY" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
          add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; worker-src 'self' blob:;" always;
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /api/v1/auth/signin {
            proxy_set_header Range "";
            limit_req   zone=login burst=10 nodelay;
            limit_conn  perip 5;

            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_hide_header Cache-Control;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;

            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        }

        location = /api/v1/auth/refresh-token {
            proxy_set_header Range "";
            limit_req   zone=login burst=20 nodelay;
            limit_conn  perip 5;

            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_hide_header Cache-Control;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;

            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        }

        location ~* ^/api/(auth|login|signin|token|sessions|password|oauth|security)/? {
          proxy_set_header Range "";
          limit_req   zone=login burst=10 nodelay;
          limit_conn  perip 5;

          proxy_pass http://backend:8080;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
        }

        location /api/ {
          proxy_set_header Range "";
          limit_req   zone=api burst=200 nodelay;
          limit_conn  perip 10;

          proxy_pass http://backend:8080;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;

          proxy_hide_header Cache-Control;

          add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
          add_header X-Frame-Options "DENY" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
          add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; worker-src 'self' blob:;" always;
        }

        location = /clarification-rule.html {
            proxy_set_header Range "";
            limit_req   zone=api burst=20 nodelay;
            limit_conn  perip 5;

            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; worker-src 'self' blob:;" always;
        }

        location = /actuator { return 301 /actuator/; }

        location ^~ /actuator/ {
          allow 10.1.1.181;
          allow 10.0.12.48;
          deny  all;

          proxy_set_header Range "";
          proxy_pass http://backend:8080;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
      listen 443 ssl default_server;
      listen [::]:443 ssl default_server;
      http2 on;
      server_name _;
      ssl_reject_handshake on;
      return 444;
    }
}
