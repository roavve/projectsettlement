services:
  backend:
    container_name: settlement-backend
    build:
      context: ./settlement-backend
      dockerfile: Dockerfile
    image: settlement-backend:latest
    restart: always
    volumes:
      - /opt/settlement/storage:/opt/settlement/storage
    stop_grace_period: 30s
    env_file:
      - .env
    networks:
      - app-network
    mem_limit: 30g
    cpus: 3.5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    ulimits:
      nofile:
        soft: 4096
        hard: 65535
    environment:
      - TZ=Asia/Tbilisi
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    container_name: settlement-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: settlement-nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cert/settlement.energo-pro.ge_cert:/etc/nginx/certs/settlement.energo-pro.ge:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - TZ=Asia/Tbilisi
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 65535
    cap_drop: ["ALL"]
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

networks:
  app-network:
    driver: bridge
