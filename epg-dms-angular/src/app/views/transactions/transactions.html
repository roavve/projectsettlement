<!-- Toggle using an icon (Chevron) -->
<div (click)="isVisible = !isVisible" class="cursor-pointer flex items-center mb-2.5">
  <span class="mr-2">
    <i [class]="isVisible ? 'fas fa-chevron-up' : 'fas fa-chevron-down'"></i>
  </span>
  <span class="font-bold text-sm">ფილტრები</span>
</div>

@if (isVisible) {
  <div class="flex flex-col gap-y-5">
    <!--პირველი ხაზი-->
    <div class="filter-row">
      <!--რეგიონი-->
      <div class="select-container">
        <select class="filter-select" [(ngModel)]="filter.region">
          <option disabled selected>აირჩიეთ რეგიონი</option>
          @for (region of _regions; track region.id) {
            <option [value]="region.name" [attr.data-id]="region.id">{{ region.name }}</option>
          }
        </select>

        <button class="filter-clear-btn" (click)="clearRegion()">✕</button>
      </div>

      <!--მ/ც-->
      <div class="select-container">
        <select class="filter-select" [(ngModel)]="filter.serviceCenter">
          <option disabled selected>აირჩიეთ მ/ც</option>
          @for (center of _serviceCenters; track center.id) {
            <option [value]="center.name">{{ center.name }}</option>
          }
        </select>

        <button class="filter-clear-btn" (click)="clearSC()">✕</button>
      </div>

      <!--ტიპი-->
      <div class="relative select-container">
        <input type="text" (click)="isTypeDropdownOpen = !isTypeDropdownOpen" placeholder="აირჩიეთ ტიპი"
               class="input input-bordered input-sm focus:outline-0 filter-select cursor-pointer" readonly/>

        <button class="filter-clear-btn" (click)="clearType(); isTypeDropdownOpen = false">✕</button>

        @if (isTypeDropdownOpen) {
          <div class="absolute z-10 bg-white border border-gray-300 rounded-md shadow-lg max-w-xs top-9">
            @for (type of withdrawTypes; track $index) {
              <div class="p-2 hover:bg-gray-100 cursor-pointer text-sm">
                <label class="flex items-center space-x-2">
                  <input type="checkbox" class="checkbox checkbox-xs"
                         [checked]="filter.withdrawType.includes(extractStartingNumber(type))"
                         (change)="toggleType(extractStartingNumber(type))"/>
                  <span>{{ ($index !== 16) ? type : "უცნობი ტიპი" }}</span>
                </label>
              </div>
            }
          </div>
        }
      </div>

      <!--სტატუსი-->
      <div class="flex">
        <div class="select-container" title="ორდერის სტატუსი">
          <select class="filter-select" [(ngModel)]="filter.orderStatus">
            <option disabled selected>ორდერის სტატუსი</option>
            <option value="ORDER_INCOMPLETE">გამოუყენებელი</option>
            <option value="ORDER_COMPLETE">შევსებული</option>
            <option value="YELLOW_AMOUNT">დასასრულებელი</option>
            <option value="CANCELED">გაუქმებული</option>
            <option value="IN_PROGRESS">პროცესში</option>
            <option value="RETURNED">დაბრუნებული</option>
          </select>

          <button class="filter-clear-btn" (click)="clearOrderStatus()">✕</button>
        </div>

        <div class="select-container" title="ჩანაწერის სტატუსი">
          <select class="filter-select" [(ngModel)]="filter.status">
            <option disabled selected>ჩანაწერის სტატუსი</option>
            <option value="TRANSFER_COMPLETE">შევსებული</option>
            <option value="TRANSFERRED">შესავსები</option>
            <option value="CANCELED">გაუქმებული</option>
          </select>

          <button class="filter-clear-btn" (click)="clearStatus()">✕</button>
        </div>
      </div>

      <!--ბრუნვა-->
      <div class="grid grid-cols-3 items-center gap-x-8">
        <p class="filter-label">ბრუნვა (კრედ)</p>

        <input type="text" class="filter-input" placeholder="მინ" [(ngModel)]="filter.totalAmountStart"/>

        <input type="text" class="filter-input" placeholder="მაქს" [(ngModel)]="filter.totalAmountEnd"/>
      </div>
    </div>
    <!--პირველი ხაზი-->

    <!--მეორე ხაზი-->
    <div class="filter-row">
      <input type="text" class="filter-input" [(ngModel)]="filter.orderN"
             placeholder="ორდერის N (მრავლობითი: 123 456 789)"/>

      <input type="text" class="filter-input" [(ngModel)]="filter.projectID" placeholder="პროექტის N"/>

      <input type="text" class="filter-input" [(ngModel)]="filter.id" placeholder="N"/>

      <input type="text" class="filter-input" [(ngModel)]="filter.purpose" placeholder="დანიშნულება"/>

      <input type="text" class="filter-input" [(ngModel)]="filter.tax" placeholder="ID"/>
    </div>
    <!--მეორე ხაზი-->

    <div class="filter-row">
      <input type="text" class="input input-bordered input-sm focus:outline-0 w-[86%]" [(ngModel)]="filter.description"
             placeholder="დამატებითი ინფორმაცია"/>

      <app-user-select [(modelValue)]="filter.change_person"/>

      <app-filter-date [(startDate)]="filter.clarificationDateStart" [(endDate)]="filter.clarificationDateEnd"
                       label="გარკვევის თარიღი" (clear)="clearClarification()"/>

      <app-filter-date [(startDate)]="filter.transferDateStart" [(endDate)]="filter.transferDateEnd"
                       label="გადმოტანის თარიღი" (clear)="clearTransfer()"/>

      <app-filter-date [(startDate)]="filter.extractionDateStart" [(endDate)]="filter.extractionDateEnd"
                       label="ჩარიცხვის თარიღი" (clear)="clearExtraction()"/>
    </div>

    <!--მესამე ხაზი-->
    <div class="filter-row">
      <input type="text" class="input input-bordered w-[85%] input-sm focus:outline-0" [(ngModel)]="filter.note"
             placeholder="შენიშვნა"/>

      <div class="select-container">
        <select class="select select-bordered select-sm w-full focus:outline-0" [(ngModel)]="sortByDir">
          <option disabled>დალაგება</option>
          @for (option of sortOptions; track $index) {
            <option [ngValue]="option">{{ option.text }}</option>
          }
        </select>
        <button class="filter-clear-btn" (click)="clearSortByDir()">✕</button>
      </div>

      <input type="text" class="filter-input" [(ngModel)]="filter.history" placeholder="History Id"/>

      <div class="flex gap-x-2">
        <button class="btn btn-neutral btn-sm">გაფილტვრა</button>
        <button class="btn btn-neutral btn-sm">გასუფთავება</button>
      </div>
    </div>
    <!--მესამე ხაზი-->
  </div>
}
