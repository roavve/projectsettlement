<div class="flex justify-center items-center" style="margin-top:120px">
  <div style="background:#fff; border-radius:20px; padding:32px; width:100%; max-width:380px; box-shadow:0 8px 24px rgba(41,19,52,.07)">
    <h2 style="font-size:22px; font-weight:700; text-align:center; margin-bottom:24px">ავტორიზაცია</h2>

    <form (ngSubmit)="handleLogin()">
      <div class="flex flex-col" style="gap:16px">
        <div class="flex flex-col gap-1.5">
          <label for="email" style="font-size:12px; font-weight:600; color:var(--text-muted)">ემაილი</label>
          <input [(ngModel)]="email" name="email" id="email" type="email"
                 class="control" style="border-radius:12px; font-size:14px; height:40px"
                 [class.control-error]="authError"/>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="password" style="font-size:12px; font-weight:600; color:var(--text-muted)">პაროლი</label>
          <input [(ngModel)]="password" name="password" id="password" type="password"
                 class="control" style="border-radius:12px; font-size:14px; height:40px"
                 [class.control-error]="authError"/>
        </div>
      </div>

      @if (authError) {
        <p class="error-text" style="margin-top:12px">{{ authError }}</p>
      }

      <button type="submit"
              class="btn-pill btn-ink"
              style="height:44px; width:100%; margin-top:8px; border-radius:12px">        შესვლა
      </button>
    </form>
  </div>
</div>
