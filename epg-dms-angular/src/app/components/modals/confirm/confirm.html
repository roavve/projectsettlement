<dialog [id]="modalId()" class="modal">
  <div class="modal-box">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 focus:outline-none">✕</button>
    </form>
    <h3 class="text-lg font-bold">{{ question() }}</h3>
    <div class="modal-action !mt-16">
      <form method="dialog" class="flex items-center justify-center w-full gap-x-5">
        <button class="btn btn-neutral" (click)="accept.emit()">{{ acceptText() }}</button>
        <button class="btn">{{ declineText() }}</button>
      </form>
    </div>
  </div>
</dialog>
