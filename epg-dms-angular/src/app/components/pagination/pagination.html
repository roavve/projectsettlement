<div class="bg-white p-4 flex justify-center items-center gap-x-10" [class]="absolute() ? 'w-full' : 'fixed bottom-0 w-screen'">
  <div class="flex items-center gap-x-4 relative">
    <span><strong>{{ startIndex }}</strong> - <strong>{{ endIndex }}</strong> of <strong>{{ totalElements() }}</strong></span>
    <i class="fas fa-caret-down cursor-pointer" (click)="showOptions = !showOptions"></i>
    @if (showOptions) {
      <ul class="absolute flex flex-col bottom-10 bg-white shadow">
        @for (option of options; track $index) {
          <li (click)="selectOption(option)"
              class="flex items-center gap-x-2.5 whitespace-nowrap cursor-pointer hover:bg-gray-300 py-2 px-3.5 text-sm">
            {{ option }} გვერდზე @if (pageSize() === option) { <i class="fa-solid fa-check text-blue-500"></i> }
          </li>
        }
      </ul>
    }
  </div>

  <div class="flex items-center gap-x-7">
    <i class="fas fa-angle-double-left cursor-pointer" [class.text-gray-300]="currentPage() === 1" [class.cursor-default]="currentPage() === 1"
       (click)="currentPage.set(1)"></i>
    <i class="fas fa-angle-left cursor-pointer" [class.text-gray-300]="currentPage() === 1" [class.cursor-default]="currentPage() === 1"
       (click)="previousPage()"></i>
    <div class="flex items-center gap-x-1">
      <input (input)="validatePage($event)" class="w-8 text-center border no-spinner" type="number" min="1" [max]="totalPages()"
             [value]="currentPage()" (keyup.enter)="onEnter($event)"/>
      <span>of {{ totalPages() }}</span>
    </div>
    <i class="fas fa-angle-right cursor-pointer" [class.text-gray-300]="currentPage() === totalPages()" [class.cursor-default]="currentPage() === totalPages()"
       (click)="nextPage()"></i>
    <i class="fas fa-angle-double-right cursor-pointer" [class.text-gray-300]="currentPage() === totalPages()" [class.cursor-default]="currentPage() === totalPages()"
       (click)="currentPage.set(totalPages())"></i>
  </div>
</div>
