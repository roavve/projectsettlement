<div class="table-footer flex justify-center items-center gap-x-10" [class]="absolute() ? 'w-full' : 'fixed bottom-0 w-screen left-0'">
  <div class="flex items-center gap-x-4 relative">
    <span class="num"><strong>{{ startIndex }}</strong> - <strong>{{ endIndex }}</strong> of <strong>{{ totalElements() }}</strong></span>
    <i class="fas fa-caret-down cursor-pointer" (click)="showOptions = !showOptions"></i>
    @if (showOptions) {
      <ul class="absolute flex flex-col bottom-10 surface-card" style="overflow:hidden">
        @for (option of options; track $index) {
          <li (click)="selectOption(option)"
              class="flex items-center gap-x-2.5 whitespace-nowrap cursor-pointer py-2 px-3.5 text-sm"
              style="transition:background-color 120ms ease"
              onmouseover="this.style.background='var(--surface-subtle)'"
              onmouseout="this.style.background='transparent'">
            {{ option }} გვერდზე @if (pageSize() === option) { <i class="fa-solid fa-check text-blue-500"></i> }
          </li>
        }
      </ul>
    }
  </div>

  <div class="flex items-center gap-x-7">
    <i class="fas fa-angle-double-left cursor-pointer" [class.arrow-disabled]="currentPage() === 1"
       (click)="currentPage.set(1)"></i>
    <i class="fas fa-angle-left cursor-pointer" [class.arrow-disabled]="currentPage() === 1"
       (click)="previousPage()"></i>
    <div class="flex items-center gap-x-1">
      <input (input)="validatePage($event)" class="page-input no-spinner num" type="number" min="1" [max]="totalPages()"
             [value]="currentPage()" (keyup.enter)="onEnter($event)"/>
      <span class="num">of {{ totalPages() }}</span>
    </div>
    <i class="fas fa-angle-right cursor-pointer" [class.arrow-disabled]="currentPage() === totalPages()"
       (click)="nextPage()"></i>
    <i class="fas fa-angle-double-right cursor-pointer" [class.arrow-disabled]="currentPage() === totalPages()"
       (click)="currentPage.set(totalPages())"></i>
  </div>
</div>
